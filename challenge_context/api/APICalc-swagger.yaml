  "/operation/standard/APICalc_searchLocation":
    post:
      security:
      - "Bearer": []
      x-codegen-request-body-name: body            
      tags:
      - Basisfunktionen
      summary: "Suche Steuerort, ignoriert Umlaute und Gross-/Kleinschreibweise, max. 200 Treffer"
      description: "required apikeys: calc.*"
      operationId: APICalc_searchLocation
      parameters:
      - in: query
        description: Mandant
        name: tenant
        schema:
          type: string            
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Search:
                  description: "Suche: [PLZ ] Ort[, Kt]"
                  type: string
                Language:
                  type: integer
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                  x-speakeasy-enums:
                    1: DE
                    2: FR
                    3: IT
                    4: EN
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: array
                    items: 
                      $ref: "#/components/schemas/APICalc_TaxLocation"
        '400':
          $ref: "#/components/responses/Error400"
        '401':
          $ref: "#/components/responses/Error401"
        '403':
          $ref: "#/components/responses/Error403"
        '404':
          $ref: "#/components/responses/Error404"
        '500':
          $ref: "#/components/responses/Error500"
