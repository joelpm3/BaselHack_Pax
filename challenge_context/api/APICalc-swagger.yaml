  "/operation/standard/APICalc_calculateEstateGainTax":
    post:
      security:
      - "Bearer": []
      x-codegen-request-body-name: body            
      tags:
      - Steuern - Grundstücksgewinnsteuer
      description: "required apikeys: calc.tax.estategain"
      operationId: APICalc_calculateEstateGainTax
      parameters:
      - in: query
        description: Mandant
        name: tenant
        schema:
          type: string            
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ TaxLocationID, Relationship, Confession1 ]
              properties:
                TaxLocationID:
                  type: integer
                Relationship:
                  type: integer
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                  x-speakeasy-enums:
                    1: Single
                    2: Married
                    3: Concubinage
                    4: RegistredPartnership
                Confession1:
                  type: integer
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                    - 9
                  x-speakeasy-enums:
                    1: Protestant
                    2: RomanCatholic
                    3: ChristCatholic
                    4: None
                    9: Other
                Confession2:
                  type: integer
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                    - 9
                  x-speakeasy-enums:
                    1: Protestant
                    2: RomanCatholic
                    3: ChristCatholic
                    4: None
                    9: Other
                ConfessionPart1:
                  description: "Anteil Konfession 1 (wie viele in Prozent der Familie haben diese Konfession, 0=automatisch)"
                  type: integer
                TaxableGain:
                  description: "steuerbarer Gewinn"
                  type: number
                OwnerYears:
                  description: "in Besitz seit wie vielen Jahren"
                  type: integer
                OwnerMonths:
                  description: "... und Monaten"
                  type: integer
                Revenues:
                  description: "Zusatzwert: Verkaufserlös"
                  type: number
                FirstCosts:
                  description: "Zusatzwert: Anlagekosten"
                  type: number
                BuildingInvest:
                  description: "Zusatzwert: Bauinvestionen"
                  type: number
                HasBuilding:
                  description: "Zusatzwert: ist überbaut"
                  type: boolean
                SelfInhabited:
                  description: "Zusatzwert: ist selbstbewohnt"
                  type: boolean
                SelfInhabYears:
                  description: "Zusatzwert: selbstbewohnt seit wie vielen Jahren"
                  type: integer
                HasDiscount:
                  description: "Zusatzwert: hat Eigentumsrabatt"
                  type: boolean
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: "#/components/schemas/APICalc_EstateGainTaxResult"
        '400':
          $ref: "#/components/responses/Error400"
        '401':
          $ref: "#/components/responses/Error401"
        '403':
          $ref: "#/components/responses/Error403"
        '404':
          $ref: "#/components/responses/Error404"
        '500':
          $ref: "#/components/responses/Error500"
  "/operation/standard/APICalc_calculateIncomeFortuneTax":
