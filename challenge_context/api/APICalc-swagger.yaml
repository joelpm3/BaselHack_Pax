  "/operation/standard/APICalc_calculateIncome":
    post:
      security:
      - "Bearer": []
      x-codegen-request-body-name: body            
      tags:
      - Basisfunktionen
      summary: "ermittelt das gewünschte Einkommen (Brutto, Netto, Steuerbar) einer Einzelperson anhand eines gegebenen Einkommens (Brutto, Netto, Steuerbar). Mindestbetrag ist 10000"
      description: "required apikeys: calc.*"
      operationId: APICalc_calculateIncome
      parameters:
      - in: query
        description: Mandant
        name: tenant
        schema:
          type: string            
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ TaxLocationID, Relationship, NumberOfChildren, BirthYear, Income, IncomeType, CalculateIncomeType ]
              properties:
                TaxLocationID:
                  type: integer
                Relationship:
                  type: integer
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                  x-speakeasy-enums:
                    1: Single
                    2: Married
                    3: Concubinage
                    4: RegistredPartnership
                NumberOfChildren:
                  description: "unterstützungspflichtige Kinder"
                  type: integer
                BirthYear:
                  type: integer
                Income:
                  type: number
                IncomeType:
                  type: integer
                  enum:
                    - 1
                    - 2
                    - 3
                  x-speakeasy-enums:
                    1: Gross
                    2: Taxable
                    3: Net
                CalculateIncomeType:
                  type: integer
                  enum:
                    - 1
                    - 2
                    - 3
                  x-speakeasy-enums:
                    1: Gross
                    2: Taxable
                    3: Net
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: number
        '400':
          $ref: "#/components/responses/Error400"
        '401':
          $ref: "#/components/responses/Error401"
        '403':
          $ref: "#/components/responses/Error403"
        '404':
          $ref: "#/components/responses/Error404"
        '500':
          $ref: "#/components/responses/Error500"
