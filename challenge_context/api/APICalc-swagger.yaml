                Income:
                  type: number
                Fortune:
                  type: number
                TaxRateDecisiveIncomeCanton:
                  description: "Kanton, satzbestimmendes Einkommen, kann angegeben bei IncomeType=Taxable"
                  type: number
                TaxRateDecisiveFortuneCanton:
                  description: "Kanton, satzbestimmendes Vermögen, kann angegeben bei IncomeType=Taxable"
                  type: number
                TaxableIncomeConf:
                  description: "Bund, steuerbares Einkommen, kann angegeben bei IncomeType=Taxable"
                  type: number
                TaxRateDecisiveIncomeConf:
                  description: "Bund, satzbestimmendes Einkommen, kann angegeben bei IncomeType=Taxable"
                  type: number
                TaxLocationID:
                  type: integer
                Relationship:
                  type: integer
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                  x-speakeasy-enums:
                    1: Single
                    2: Married
                    3: Concubinage
                    4: RegistredPartnership
                Confession1:
                  type: integer
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                    - 9
                  x-speakeasy-enums:
                    1: Protestant
                    2: RomanCatholic
                    3: ChristCatholic
                    4: None
                    9: Other
                Confession2:
                  type: integer
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                    - 9
                  x-speakeasy-enums:
                    1: Protestant
                    2: RomanCatholic
                    3: ChristCatholic
                    4: None
                    9: Other
                ConfessionPart1:
                  description: "Anteil Konfession 1 (wie viele in Prozent der Familie haben diese Konfession, 0=automatisch)"
                  type: integer
                NumberOfChildren:
                  description: "unterstützungspflichtige Kinder"
                  type: integer
                BirthYear:
                  type: integer
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    $ref: "#/components/schemas/APICalc_IncomeFortuneTaxResult"
        '400':
          $ref: "#/components/responses/Error400"
        '401':
          $ref: "#/components/responses/Error401"
        '403':
          $ref: "#/components/responses/Error403"
        '404':
          $ref: "#/components/responses/Error404"
        '500':
          $ref: "#/components/responses/Error500"
