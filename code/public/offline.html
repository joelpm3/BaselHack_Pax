<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3c0078" />
    <title>Offline · Pax Clara</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #3c0078; color: #fff; font-family: Arial, system-ui, sans-serif; }
      main { max-width: 22rem; padding: 2rem 1.5rem; }
      .dot { width: 1.25rem; height: 1.25rem; background: #8ccd0f; margin-bottom: 1.5rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
      p { margin: 0 0 1.5rem; line-height: 1.55; color: #e7e1ee; }
      button { font: inherit; font-weight: 500; border: 0; border-radius: 999px; padding: 0.75rem 1.5rem; background: #8ccd0f; color: #121212; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="dot" aria-hidden="true"></div>
      <h1>Keine Verbindung</h1>
      <p>Ihre Beratung ist gespeichert. Sobald Sie wieder online sind, geht es genau dort weiter.</p>
      <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </main>
  </body>
</html>
